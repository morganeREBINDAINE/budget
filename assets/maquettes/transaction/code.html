<script>
  // Interactive micro-behavior for the 3x3 category grid selection
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('category-grid');
    if (!grid) return;
    
    const buttons = grid.querySelectorAll('button');
    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        // Simple visual toggle highlight for demo responsiveness
        buttons.forEach(b => {
          b.classList.remove('scale-[1.02]');
        });
        btn.classList.add('scale-[1.02]');
      });
    });
  });
</script></main>
